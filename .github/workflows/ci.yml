name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm run install:all

      - name: Run checks
        run: npm run check
